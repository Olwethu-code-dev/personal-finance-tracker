<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finance Tracker - Expenses</title>

    <link rel="stylesheet" href="Styles.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2>Finance Tracker</h2>
            <ul>
                <li>
                    <a href="dashboard.html">Dashboard</a>
                </li>

                <li>
                    <a href="income.html">Income</a>
                </li>

                <li class="active">
                    <a href="expenses.html">Expenses</a>
                </li>

                <li>
                    <a href="budget.html">Budget</a>
                </li>

                <li>
                    <a href="reports.html">Reports</a>
                </li>

                <li>
                    <a href="profile.html">Profile</a>
                </li>

                <li>
                    <a href="#" id="logoutLink">Logout</a>
                </li>
            </ul>
        </aside>

        <main class="content">

            <header>

                <h1>Expenses</h1>

                <p>Keep track of where your money goes.</p>

            </header>

            <section class="form-card">

                <h2>Add Expense</h2>

                <form id="expenseForm">

                    <div class="form-group">

                        <label for="expenseCategory">
                            Category
                        </label>

                        <select id="expenseCategory" required>

                            <option value="">
                                Select a category
                            </option>

                            <option value="Food">
                                Food
                            </option>

                            <option value="Transport">
                                Transport
                            </option>

                            <option value="Entertainment">
                                Entertainment
                            </option>

                            <option value="Bills">
                                Bills
                            </option>

                            <option value="Shopping">
                                Shopping
                            </option>
                            <option value="Other">
                                Other
                            </option>
                        </select>
                    </div>

                    <div class="form-group">

                        <label for="expenseAmount">
                            Amount
                        </label>
                        <input
                            type="number"
                            id="expenseAmount"
                            placeholder="Enter amount"
                            min="0"
                            step="0.01"
                            required
                        >
                    </div>

                    <div class="form-group">

                        <label for="expenseDate">
                            Date
                        </label>

                        <input
                            type="date"
                            id="expenseDate"
                            required
                        >
                    </div>

                    <button type="submit" class="login-button">
                        Add Expense
                    </button>
                </form>
            </section>

   <section class="transactions">
    <h2>Expense History</h2>

    <div id="expenseHistory">
        <p>No expenses have been added yet.</p>
    </div>
</section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
